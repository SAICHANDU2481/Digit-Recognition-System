services:
  - type: web
    name: digit-recognition-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: FLASK_DEBUG
        value: "False"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
